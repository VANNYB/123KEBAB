<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B2F23">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Appel des commandes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#101A16;--green:#14503C;--deep:#0B2F23;--ivory:#F4EAD6;--amber:#FFC24B}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;background:var(--ivory)}
button{font-family:inherit;cursor:pointer;border:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.num{font-family:'Anton',Impact,'Haettenschweiler','Arial Narrow',sans-serif;letter-spacing:.02em;font-weight:400}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase}
.hidden{display:none!important}

.topbar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--deep);color:var(--ivory);position:sticky;top:0;z-index:5}
.topbar .brand{flex:1;font-weight:700;letter-spacing:.04em;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab{background:transparent;color:#F4EAD6AA;padding:7px 12px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tab.on{background:var(--amber);color:var(--ink)}

.console{background:var(--ivory);color:var(--ink);min-height:100vh;padding:16px 14px 48px}
.wrap{max-width:460px;margin:0 auto}
#input{width:100%;background:#fff;border:2px solid #101A1622;border-radius:14px;padding:14px 16px;font-size:38px;text-align:center;color:var(--ink);font-family:'Anton',Impact,sans-serif;letter-spacing:.06em}
#input::placeholder{color:#101A1633}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.key{background:#fff;color:var(--ink);border-radius:14px;padding:16px 0;font-size:24px;font-weight:700;box-shadow:0 1px 0 #101A1618;transition:transform .06s ease,background .12s}
.key:active{transform:translateY(1px);background:#101A160D}
.key.wipe{background:#101A1610;font-size:15px;letter-spacing:.06em}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.btn{border-radius:14px;padding:15px 10px;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;transition:opacity .15s}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-prep{background:var(--green);color:var(--ivory)}
.btn-ready{background:var(--amber);color:var(--ink)}
.sect{display:flex;align-items:baseline;gap:8px;margin:26px 0 10px}
.sect .rule{flex:1;height:1px;background:#101A1626}
.count{font-weight:700;font-size:12px;opacity:.55}
.rows{display:flex;flex-wrap:wrap;gap:8px}
.row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:8px 10px 8px 14px;box-shadow:0 1px 0 #101A1614}
.row.rd{background:var(--amber);box-shadow:none}
.row .n{font-size:26px;line-height:1}
.row .meta{font-size:11px;opacity:.55;min-width:34px}
.mini{border-radius:9px;padding:8px 11px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--ivory)}
.mini.ghost{background:#101A1614;color:var(--ink)}
.empty{font-size:13px;opacity:.5;padding:6px 2px;margin:0}
.settings{margin-top:30px;border-top:1px solid #101A1626;padding-top:16px}
.field{display:block;margin-bottom:12px}
.field span{display:block;margin-bottom:5px;opacity:.6}
.field input{width:100%;background:#fff;border:1px solid #101A1626;border-radius:10px;padding:10px 12px;font-size:14px;color:var(--ink);font-family:inherit}
.toggle{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:500}
.hint{font-size:12px;opacity:.55;line-height:1.5;margin-top:16px}
.hint code{background:#101A1614;padding:1px 5px;border-radius:5px}

.screen{background:var(--deep);color:var(--ivory);min-height:100vh;display:flex;flex-direction:column;overflow:hidden}
.screen-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:20px 32px 12px;border-bottom:1px solid #F4EAD622}
.screen-head h1{margin:0;font-size:clamp(20px,3vw,34px);font-weight:700;letter-spacing:.04em}
.clock{font-size:clamp(18px,2.4vw,30px);font-variant-numeric:tabular-nums;opacity:.8}
.cols{flex:1;display:grid;grid-template-columns:1fr 1.4fr}
.col{padding:18px 26px;min-width:0}
.col+.col{border-left:1px solid #F4EAD622}
.col h2{margin:0 0 14px;font-size:clamp(11px,1.2vw,15px);font-weight:700;letter-spacing:.24em;text-transform:uppercase;opacity:.62}
.grid{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start}
.chip{border:2px solid #F4EAD644;border-radius:14px;padding:6px 16px;font-size:clamp(28px,4.4vw,58px);line-height:1.1;opacity:.72}
.chip.rd{border-color:transparent;background:var(--amber);color:var(--ink);opacity:1;padding:6px 22px;font-size:clamp(38px,6.6vw,96px);animation:flip .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes flip{from{transform:rotateX(-90deg);opacity:0}to{transform:rotateX(0);opacity:1}}
.ticker{padding:12px 32px;border-top:1px solid #F4EAD622;font-size:clamp(12px,1.4vw,18px);letter-spacing:.06em;opacity:.75}
.screen-empty{font-size:clamp(13px,1.4vw,18px);opacity:.45;margin:0}
.fs{background:#F4EAD61A;color:var(--ivory);border-radius:999px;padding:8px 14px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
#callout{position:fixed;inset:0;background:var(--amber);color:var(--ink);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:in .3s ease both}
@keyframes in{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
#callout .lbl{font-size:clamp(12px,1.8vw,22px);font-weight:700;letter-spacing:.3em;text-transform:uppercase}
#callout .big{font-size:clamp(110px,32vw,420px);line-height:.9;margin-top:8px}
@media(max-width:720px){.cols{grid-template-columns:1fr}.col+.col{border-left:none;border-top:1px solid #F4EAD622}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="topbar">
  <span class="brand" id="brandTop">Le Comptoir</span>
  <button class="tab on" id="tabConsole">Console</button>
  <button class="tab" id="tabScreen">Écran client</button>
</div>

<!-- ================= CONSOLE ================= -->
<section id="viewConsole" class="console">
  <div class="wrap">
    <input id="input" placeholder="N°" autocomplete="off" aria-label="Numéro de commande">
    <div class="pad" id="pad"></div>
    <div class="actions">
      <button class="btn btn-prep" id="addPrep" disabled>En préparation</button>
      <button class="btn btn-ready" id="addReady" disabled>Prêt</button>
    </div>

    <div class="sect"><span class="eyebrow">En préparation</span><span class="rule"></span><span class="count" id="cPrep">0</span></div>
    <div class="rows" id="listPrep"></div>

    <div class="sect"><span class="eyebrow">Prêt à retirer</span><span class="rule"></span><span class="count" id="cReady">0</span></div>
    <div class="rows" id="listReady"></div>

    <div class="settings">
      <p class="eyebrow" style="opacity:.5;margin:0 0 12px">Réglages</p>
      <label class="field"><span class="eyebrow">Nom affiché</span><input type="text" id="setName"></label>
      <label class="field"><span class="eyebrow">Message bas d'écran</span><input type="text" id="setMsg"></label>
      <label class="field"><span class="eyebrow">Retirer les numéros servis après (minutes, 0 = jamais)</span><input type="number" min="0" id="setClear"></label>
      <label class="toggle"><input type="checkbox" id="setSound"> Carillon à chaque appel</label>
      <p class="hint">Sur la TV, ouvrez ce même fichier avec <code>#ecran</code> à la fin de l'adresse : l'écran client s'affiche directement.</p>
    </div>
  </div>
</section>

<!-- ================= ÉCRAN CLIENT ================= -->
<section id="viewScreen" class="screen hidden">
  <div class="screen-head">
    <h1 id="brandScreen">Le Comptoir</h1>
    <div style="display:flex;align-items:center;gap:14px">
      <span class="clock" id="clock"></span>
      <button class="fs" id="fsBtn">Plein écran</button>
    </div>
  </div>
  <div class="cols">
    <div class="col"><h2>En préparation</h2><div class="grid" id="scPrep"></div></div>
    <div class="col"><h2>Prêt à retirer</h2><div class="grid" id="scReady"></div></div>
  </div>
  <div class="ticker" id="ticker"></div>
</section>

<script>
(function(){
"use strict";
var KEY="orderboard.v1";
var DEFAULTS={name:"Le Comptoir",message:"Présentez votre numéro au passe pour retirer votre commande.",sound:true,autoClear:10};
var state={orders:[],settings:Object.assign({},DEFAULTS)};
var view="console", knownReady={}, lastRaw="", audioCtx=null, calloutTimer=null;
var $=function(id){return document.getElementById(id)};

/* ---------- stockage ---------- */
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(!raw) return;
    lastRaw=raw;
    var d=JSON.parse(raw);
    state.orders=d.orders||[];
    state.settings=Object.assign({},DEFAULTS,d.settings||{});
  }catch(e){}
}
function save(){
  try{
    lastRaw=JSON.stringify(state);
    localStorage.setItem(KEY,lastRaw);
    if(chan) chan.postMessage(lastRaw);
  }catch(e){}
}
var chan=null;
try{ chan=new BroadcastChannel("orderboard"); chan.onmessage=function(e){ apply(e.data) }; }catch(e){}
window.addEventListener("storage",function(e){ if(e.key===KEY) apply(e.newValue) });
setInterval(function(){ try{ apply(localStorage.getItem(KEY)) }catch(e){} },1500);

function apply(raw){
  if(!raw||raw===lastRaw) return;
  try{
    var d=JSON.parse(raw);
    lastRaw=raw;
    state.orders=d.orders||[];
    state.settings=Object.assign({},DEFAULTS,d.settings||{});
    render();
  }catch(e){}
}

/* ---------- son ---------- */
function chime(){
  if(!state.settings.sound) return;
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended") audioCtx.resume();
    [[880,0],[1318.5,.16]].forEach(function(p){
      var o=audioCtx.createOscillator(), g=audioCtx.createGain(), t=audioCtx.currentTime+p[1];
      o.type="sine"; o.frequency.value=p[0];
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(.28,t+.02);
      g.gain.exponentialRampToValueAtTime(.0001,t+.9);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t+1);
    });
  }catch(e){}
}

/* ---------- actions ---------- */
function mins(t){ return Math.max(0,Math.floor((Date.now()-t)/60000)) }
function add(status){
  var n=$("input").value.trim().toUpperCase();
  if(!n) return;
  if(!state.orders.some(function(o){return o.number===n})){
    state.orders.push({id:Date.now()+"-"+n,number:n,status:status,createdAt:Date.now(),readyAt:status==="ready"?Date.now():null});
  }
  $("input").value=""; save(); render();
}
function markReady(id){
  state.orders.forEach(function(o){ if(o.id===id){o.status="ready";o.readyAt=Date.now()} });
  save(); render();
}
function remove(id){
  state.orders=state.orders.filter(function(o){return o.id!==id});
  save(); render();
}

/* ---------- rendu ---------- */
function render(){
  var prep=state.orders.filter(function(o){return o.status==="preparing"});
  var ready=state.orders.filter(function(o){return o.status==="ready"}).sort(function(a,b){return a.readyAt-b.readyAt});

  $("brandTop").textContent=state.settings.name;
  $("brandScreen").textContent=state.settings.name;
  $("ticker").textContent=state.settings.message;

  /* console */
  $("cPrep").textContent=prep.length;
  $("cReady").textContent=ready.length;
  var lp=$("listPrep"); lp.innerHTML="";
  if(!prep.length) lp.innerHTML='<p class="empty">Aucune commande en cours.</p>';
  prep.forEach(function(o){
    var d=document.createElement("div"); d.className="row";
    d.innerHTML='<span class="num n"></span><span class="meta">'+mins(o.createdAt)+' min</span>';
    d.firstChild.textContent=o.number;
    var b=document.createElement("button"); b.className="mini"; b.textContent="Prêt";
    b.onclick=function(){markReady(o.id)};
    var x=document.createElement("button"); x.className="mini ghost"; x.textContent="✕";
    x.setAttribute("aria-label","Annuler"); x.onclick=function(){remove(o.id)};
    d.appendChild(b); d.appendChild(x); lp.appendChild(d);
  });
  var lr=$("listReady"); lr.innerHTML="";
  if(!ready.length) lr.innerHTML='<p class="empty">Rien au passe pour le moment.</p>';
  ready.forEach(function(o){
    var d=document.createElement("div"); d.className="row rd";
    d.innerHTML='<span class="num n"></span><span class="meta">'+mins(o.readyAt)+' min</span>';
    d.firstChild.textContent=o.number;
    var b=document.createElement("button"); b.className="mini"; b.textContent="Servi";
    b.onclick=function(){remove(o.id)};
    d.appendChild(b); lr.appendChild(d);
  });

  /* écran client */
  var sp=$("scPrep"); sp.innerHTML="";
  if(!prep.length) sp.innerHTML='<p class="screen-empty">—</p>';
  prep.forEach(function(o){
    var s=document.createElement("span"); s.className="chip num"; s.textContent=o.number; sp.appendChild(s);
  });
  var sr=$("scReady"); sr.innerHTML="";
  if(!ready.length) sr.innerHTML='<p class="screen-empty">Les numéros s\'affichent ici dès qu\'une commande est prête.</p>';
  ready.forEach(function(o){
    var s=document.createElement("span"); s.className="chip rd num"; s.textContent=o.number; sr.appendChild(s);
  });

  /* appel : carillon + plein écran sur le numéro */
  var fresh=ready.filter(function(o){return !knownReady[o.id]});
  ready.forEach(function(o){knownReady[o.id]=1});
  if(fresh.length){
    chime();
    if(view==="screen") callout(fresh[fresh.length-1].number);
  }
}

function callout(n){
  var old=$("callout"); if(old) old.remove();
  clearTimeout(calloutTimer);
  var d=document.createElement("div"); d.id="callout";
  d.innerHTML='<span class="lbl">Commande prête</span><span class="big num"></span>';
  d.lastChild.textContent=n;
  d.onclick=function(){d.remove()};
  document.body.appendChild(d);
  calloutTimer=setTimeout(function(){ if(d.parentNode) d.remove() },4000);
}

/* ---------- vues ---------- */
function setView(v){
  view=v;
  $("viewConsole").classList.toggle("hidden",v!=="console");
  $("viewScreen").classList.toggle("hidden",v!=="screen");
  $("tabConsole").classList.toggle("on",v==="console");
  $("tabScreen").classList.toggle("on",v==="screen");
  document.body.style.background=v==="screen"?"var(--deep)":"var(--ivory)";
  if(v==="screen") chime();
}
$("tabConsole").onclick=function(){setView("console")};
$("tabScreen").onclick=function(){setView("screen")};
$("fsBtn").onclick=function(){
  try{ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen() }catch(e){}
};

/* ---------- pavé ---------- */
var keys=["1","2","3","4","5","6","7","8","9","Effacer","0","←"];
keys.forEach(function(k){
  var b=document.createElement("button");
  b.className="key"+(k==="Effacer"||k==="←"?" wipe":"");
  b.textContent=k;
  b.onclick=function(){
    var i=$("input");
    if(k==="Effacer") i.value="";
    else if(k==="←") i.value=i.value.slice(0,-1);
    else i.value=(i.value+k).slice(0,6);
    syncButtons();
  };
  $("pad").appendChild(b);
});
function syncButtons(){
  var empty=!$("input").value.trim();
  $("addPrep").disabled=empty; $("addReady").disabled=empty;
}
$("input").addEventListener("input",function(){ this.value=this.value.slice(0,6).toUpperCase(); syncButtons() });
$("input").addEventListener("keydown",function(e){ if(e.key==="Enter") add("preparing") });
$("addPrep").onclick=function(){add("preparing")};
$("addReady").onclick=function(){add("ready")};

/* ---------- réglages ---------- */
function bindSettings(){
  $("setName").value=state.settings.name;
  $("setMsg").value=state.settings.message;
  $("setClear").value=state.settings.autoClear;
  $("setSound").checked=state.settings.sound;
}
$("setName").oninput=function(){state.settings.name=this.value;save();render()};
$("setMsg").oninput=function(){state.settings.message=this.value;save();render()};
$("setClear").oninput=function(){state.settings.autoClear=Number(this.value)||0;save()};
$("setSound").onchange=function(){state.settings.sound=this.checked;save()};

/* ---------- horloge, retrait auto ---------- */
function tick(){
  $("clock").textContent=new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
  var lim=(state.settings.autoClear||0)*60000;
  if(lim){
    var before=state.orders.length;
    state.orders=state.orders.filter(function(o){return o.status!=="ready"||Date.now()-o.readyAt<lim});
    if(state.orders.length!==before) save();
  }
  render();
}
setInterval(tick,15000);

/* ---------- démarrage ---------- */
load();
state.orders.filter(function(o){return o.status==="ready"}).forEach(function(o){knownReady[o.id]=1});
bindSettings();
if(location.hash.indexOf("ecran")>-1||location.hash.indexOf("screen")>-1) setView("screen");
render(); tick(); syncButtons();
})();
</script>
</body>
</html>
